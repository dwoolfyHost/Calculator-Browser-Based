<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="calculator">

    <div class="top-panel">

        <div class="titlebar">
            Calculator
        </div>

        <div class="expression-display">
            <div class="expression"></div>
        </div>

        <div class="display">
            <div class="result">0</div>
        </div>

    </div>

    <div class="button-grid">

        <!-- Row 1 -->
        <button>MC</button>
        <button>MR</button>
        <button>MS</button>
        <button>M+</button>
        <button>M-</button>

        <!-- Row 2 -->
        <button>←</button>
        <button>CE</button>
        <button>C</button>
        <button>±</button>
        <button>√</button>

        <!-- Row 3 -->
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>/</button>
        <button>%</button>

        <!-- Row 4 -->
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>*</button>
        <button>1/x</button>

        <!-- Row 5 -->
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>-</button>
        <button>=</button>

        <!-- Row 6 -->
        <button class="zero">0</button>
        <button>.</button>
        <button>+</button>

    </div>

</div>

</body>
</html>
