<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="calculator">

    <div class="top-panel">

        <div class="titlebar">
            Calculator
        </div>

        <div id="expression" class="expression-display">
            <div id="expression" class="expression"></div>
        </div>

        <div class="display">
            <div id="result" class="result">0</div>
        </div>

    </div>

    <div class="button-grid">

    <!-- Row 1 -->
    <button class="clear" data-action="CLEAR">Clear</button>
    <button class="edit" data-action="DELETE">Del</button>
    <button class="edit" data-action="LEFT">←</button>
    <button class="edit" data-action="RIGHT">→</button>
    <button class="operator" data-action="ANS">ANS</button>

    <!-- Row 2 -->
    <button class="operator" data-action="(">(</button>
    <button class="operator" data-action=")">)</button>
    <button class="operator" data-action="^">^</button>
    <button class="operator" data-action="ROOT">√</button>
    <button class="function" data-action="PI">π</button>

    <!-- Row 3 -->
    <button data-action="7">7</button>
    <button data-action="8">8</button>
    <button data-action="9">9</button>
    <button class="operator" data-action="/">/</button>
    <button class="function" data-action="E">e</button>

    <!-- Row 4 -->
    <button data-action="4">4</button>
    <button data-action="5">5</button>
    <button data-action="6">6</button>
    <button class="operator" data-action="*">*</button>
    <button class="function" data-action="LOG">log</button>

    <!-- Row 5 -->
    <button data-action="1">1</button>
    <button data-action="2">2</button>
    <button data-action="3">3</button>
    <button class="operator" data-action="-">-</button>
    <button class="function" data-action="LN">ln</button>

    <!-- Row 6 -->
    <button class="zero" data-action="0">0</button>
    <button data-action=".">.</button>
        <button class="operator" data-action="+">+</button>
        <button class="equals" data-action="ENTER">Eval</button>

    </div>

</div>



    <script type="module" src="js/main.js"></script>

</body>
</html>
